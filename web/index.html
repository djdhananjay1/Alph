<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alph — Universal MCP Manager</title>
    <script>
      // Restore path from GitHub Pages SPA 404 redirect
      (function() {
        var p = window.location.search.slice(1).split('&').filter(function(s){ return s.startsWith('p='); })[0];
        if (p) {
          var decoded = '/' + p.slice(2).replace(/~and~/g, '&');
          window.history.replaceState(null, null, decoded + (window.location.hash || ''));
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
