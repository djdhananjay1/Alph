name: Release Binaries

on:
  release:
    types: [published]

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: windows-latest
            label: Windows
            script: build:win
            asset: binaries/alph-connect-windows.exe
            asset_name: alph-connect-windows.exe
            content_type: application/octet-stream

          - os: macos-latest
            label: macOS
            script: build:mac
            asset: binaries/alph-connect-macos
            asset_name: alph-connect-macos
            content_type: application/octet-stream

          - os: ubuntu-latest
            label: Linux
            script: build:linux
            asset: binaries/alph-connect-linux
            asset_name: alph-connect-linux
            content_type: application/octet-stream

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build binary
        run: npm run ${{ matrix.script }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
